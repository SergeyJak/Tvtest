name: tests
on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate admin JavaScript syntax
        run: node --check admin/app.js
      - name: Set up rendered dashboard test
        run: |
          python -m pip install playwright==1.62.0
          command -v google-chrome || command -v chromium || python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
